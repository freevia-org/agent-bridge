# Push a tag like v0.2.0 to build the standalone executables for every
# platform, test each one, and attach them to the GitHub release for that tag.
# Running it by hand (workflow_dispatch) on a branch builds and tests
# everything but publishes nothing: a dry run.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    # Same lint, tests, build and executable tests as every PR.
    uses: ./.github/workflows/ci.yml
    with:
      upload: true

  publish:
    needs: ci
    # Like before, every platform whose build and tests passed is attached even
    # if another platform failed (the run itself still reports the failure).
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: agent-bridge-i5-linux
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: exe-*
          path: dist
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/agent-bridge-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no executable passed its tests; nothing to publish"; exit 1
          fi
          ls -l "${files[@]}"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

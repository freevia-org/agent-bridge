# Push a tag like v0.2.0 to build the standalone executables for every
# platform, test each one, and attach them to the GitHub release for that tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest            # Apple Silicon
          - os: macos-latest            # Intel: x64 Node under Rosetta builds the x64 binary
            arch: x64
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.os }}${{ matrix.arch && format(' {0}', matrix.arch) || '' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
      - run: npm ci
      - name: Test (source)
        run: npm test
      - name: Build executable
        run: npm run build:exe
      - name: Test (executable)
        shell: bash
        run: AGENT_BRIDGE_EXE="$(ls "$PWD"/dist/agent-bridge-*)" npm test
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/agent-bridge-* --clobber

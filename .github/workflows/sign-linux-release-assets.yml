name: Sign published Linux release assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to sign
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  sign-linux-assets:
    if: github.event_name != 'release' || github.event.release.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and sign Linux release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" || ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft,assets > release.json
          if [[ "$(jq -r '.isDraft' release.json)" != "false" ]]; then
            echo "Refusing to sign a draft release." >&2
            exit 1
          fi

          mapfile -t assets < <(jq -r '
            .assets[].name
            | select((ascii_downcase | test("linux|\\.deb$|\\.rpm$|\\.appimage$|\\.flatpak$")))
            | select((ascii_downcase | test("sha256|checksum|sigstore|provenance|receipt|report|source|license|readme")) | not)
          ' release.json)
          if (( ${#assets[@]} == 0 )); then
            echo "No Linux payload assets found; refusing to create an empty signing result." >&2
            exit 1
          fi

          mkdir -p signed
          for asset in "${assets[@]}"; do
            if [[ "$asset" == */* || "$asset" == *$'\n'* ]]; then
              echo "Unexpected asset filename: $asset" >&2
              exit 1
            fi
            gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern "$asset" --dir signed
            test -s "signed/$asset"
            (
              cd signed
              cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
              sha256sum "$asset" > "$asset.sha256"
            )
            gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" --clobber \
              "signed/$asset.sigstore.json" "signed/$asset.sha256"
          done
